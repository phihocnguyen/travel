# Temporary deployment by IP; no domain or TLS certificate required.
# Run this file on its own, not as an override of docker-compose.yml.
name: travel

services:
  db:
    extends:
      file: docker-compose.yml
      service: db

  migrate:
    extends:
      file: docker-compose.yml
      service: migrate

  app:
    extends:
      file: docker-compose.yml
      service: app

  nginx:
    image: nginx:stable-bookworm
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  image_data:
