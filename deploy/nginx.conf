server {
    listen 80;
    server_name vixoaidanloi.com;
    return 301 https://vixoaidanloi.com$request_uri;
}

server {
    listen 443 ssl;
    server_name vixoaidanloi.com;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    # Docker DNS: resolve the new app container after an update.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_backend app:3000;

    location / {
        proxy_pass http://$app_backend;
        # Normalize redirects from older app images using the bind address.
        proxy_redirect https://0.0.0.0:3000/ https://vixoaidanloi.com/;
        proxy_redirect http://0.0.0.0:3000/ https://vixoaidanloi.com/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
